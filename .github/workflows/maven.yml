# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI - Tests with Visual Report v1.1 JGG

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest    
    steps:
    # 1. Clone repository
    - uses: actions/checkout@v4   
    # 2. Configurate JDK
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'corretto'
        cache: maven     

    # 3. Execute all of the tests with Maven
    - name: Run Maven tests
      run: mvn -B clean test --file pom.xml

    # 4. Generate HTML reports and site
    - name: Generate HTML report
      if: always()
      run: mvn surefire-report:report
      
    # 5. Upload the test reports as artifacts
    - name: Upload test reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: |
          target/surefire-reports/*.xml
          target/surefire-reports-html/

    # 6. Show a quick summary of all the tests inside the logs
    - name: Show test summary
      if: always()
      run: |
        echo "---- Test Summary ----"
        find target/surefire-reports/ -name "*.txt" -exec grep -E "Tests run|Failures|Errors" {} \;
